<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Search and discover movies, ratings, genres, cast and more.">

    <meta name="theme-color" content="#0f1117">

    <title>MovieFinder | Discover Movies</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <header class="header">

        <nav class="navbar" aria-label="Main navigation">




            <a href="#" class="logo" aria-label="MovieFinder Home">
                MovieFinder
            </a>




            <form class="search-box" id="searchForm">

                <input class="search-input" type="search" id="movieSearch" placeholder="Search movies..."
                    autocomplete="off" aria-label="Search movies">

                <button type="submit" id="searchBtn">
                    Search
                </button>

            </form>


            <a href="#" class="home-link">
                Home
            </a>


        </nav>

    </header>


    <main class="main">



        <section class="hero" aria-labelledby="heroTitle">

            <h1 id="heroTitle">
                Find Your Next Movie
            </h1>

            <p>
                Search for movies, ratings, genres and more.
            </p>

        </section>


        <section class="movies-section" aria-labelledby="moviesTitle">


            <div class="section-header">

                <h2 id="moviesTitle">
                    Movies
                </h2>

                <p id="resultText">
                    Search for a movie to get started
                </p>

            </div>



            <div class="movie-grid" id="movieContainer">



            </div>


        </section>


    </main>



    <footer class="footer">

        <p>
            © 2026 MovieFinder. Built with JavaScript.
        </p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
