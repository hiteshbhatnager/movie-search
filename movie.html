<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Movie details">

    <title>Movie Details | MovieFinder</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./movie.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <nav class="navbar">

            <a href="index.html" class="logo">
                MovieFinder
            </a>

            <form class="search-box" id="searchForm">
                <input type="search" id="movieSearch" placeholder="Search movies..." autocomplete="off">

                <button type="submit">
                    Search
                </button>
            </form>

            <a href="index.html" class="home-link">
                Home
            </a>

        </nav>
    </header>


    <!-- Main -->
    <main class="movie-details">

        <!-- Back Button -->
        <a href="index.html" class="back-btn">
            ← Back to Movies
        </a>


        <!-- Movie Details -->
        <section class="movie-container" id="movieContainer">

            <!-- Poster -->
            <div class="movie-poster">
                <img id="moviePoster" src="" alt="Movie poster">
            </div>


            <!-- Information -->
            <div class="movie-content">

                <h1 id="movieTitle">
                    Loading...
                </h1>

                <div class="movie-meta">

                    <span id="movieYear">
                        2026
                    </span>

                    <span id="movieRating">
                        ⭐ 0.0
                    </span>

                    <span id="movieRuntime">
                        120 min
                    </span>

                </div>


                <p class="movie-genre" id="movieGenre">
                    Action • Adventure
                </p>


                <p class="movie-plot" id="moviePlot">
                    Loading movie description...
                </p>


                <div class="movie-info-list">

                    <p>
                        <strong>Director:</strong>
                        <span id="movieDirector">-</span>
                    </p>

                    <p>
                        <strong>Actors:</strong>
                        <span id="movieActors">-</span>
                    </p>

                    <p>
                        <strong>Language:</strong>
                        <span id="movieLanguage">-</span>
                    </p>

                    <p>
                        <strong>Country:</strong>
                        <span id="movieCountry">-</span>
                    </p>

                </div>


                <button class="favorite-btn" id="favoriteBtn">
                    ♡ Add to Favorites
                </button>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 MovieFinder. Built with JavaScript.</p>
    </footer>


    <script src="./movie.js"></script>

</body>

</html>
